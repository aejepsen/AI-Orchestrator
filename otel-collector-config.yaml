# OTel Collector — recebe OTLP do gateway e faz fan-out:
#   traces  → Phoenix (OTLP HTTP :6006) + debug
#   métricas → Prometheus exporter (:8889), raspado pelo gateway em /metrics
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

exporters:
  debug:
    verbosity: basic
  prometheus:
    endpoint: 0.0.0.0:8889
  otlphttp/phoenix:
    endpoint: http://phoenix:6006
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/phoenix, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-orchestrator-ollama
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # MoE 30B-A3B Q4 precisa ~17.8 GiB total: ~10 GiB GPU + ~8 GiB RAM/swap.
      - OLLAMA_KEEP_ALIVE=5m
    deploy:
      resources:
        limits:
          memory: 12g
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: ai-orchestrator-gateway
    ports:
      - "127.0.0.1:8100:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      # Modelo do grafo (classificador/agentes/síntese). Na RTX 3060 (12 GB) o
      # 30b-a3b transborda 44% pra CPU — latência alta; 7b roda 100% na GPU.
      - MODEL=${MODEL:-qwen2.5:7b-instruct-q4_K_M}
      - SERVICE_URL_FINANCAS=http://financas:8000
      - SERVICE_URL_RH=http://rh:8000
      - SERVICE_URL_ESTOQUE=http://estoque:8000
      - SERVICE_URL_VENDAS=http://vendas:8000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?defina INTERNAL_API_KEY no .env}
      # Boundary público: sem ACCESS_TOKEN o /chat fica aberto (modo dev).
      - ACCESS_TOKEN=${ACCESS_TOKEN:-}
      - RATE_LIMIT_PER_HOUR=${RATE_LIMIT_PER_HOUR:-10}
      # Fan-out 3 domínios enfileira no MoE único (Ollama serializa): o 3º agente
      # espera ~2 loops inteiros antes de começar — 300 s estourava (medido na demo).
      - LLM_TIMEOUT_S=900
      # Semantic router: golden set indexado no Qdrant, embeddings locais.
      - QDRANT_URL=http://qdrant:6333
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - SEMANTIC_ENABLED=${SEMANTIC_ENABLED:-1}
      - SEMANTIC_THRESHOLD=${SEMANTIC_THRESHOLD:-0.92}
      # Langfuse: observabilidade LLM (traces, generations, scores).
      - LANGFUSE_HOST=http://langfuse:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-local}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-local}
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-1}
      - THREAD_DB_PATH=/tmp/threads.db
    depends_on:
      ollama:
        condition: service_started
      qdrant:
        condition: service_started
      financas:
        condition: service_started
      rh:
        condition: service_started
      estoque:
        condition: service_started
      vendas:
        condition: service_started
      langfuse:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=3)"]
      interval: 30s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Banco vetorial do semantic router (collection routing_examples).
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-orchestrator-qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # Imagem não tem curl/wget; checagem TCP via bash builtin.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  financas:
    build:
      context: ./services
      args:
        SERVICE: financas
    container_name: ai-orchestrator-financas
    ports:
      - "127.0.0.1:8101:8000"
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?defina INTERNAL_API_KEY no .env}
    volumes:
      - financas_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=3)"]
      interval: 30s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  rh:
    build:
      context: ./services
      args:
        SERVICE: rh
    container_name: ai-orchestrator-rh
    ports:
      - "127.0.0.1:8102:8000"
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?defina INTERNAL_API_KEY no .env}
    volumes:
      - rh_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=3)"]
      interval: 30s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  estoque:
    build:
      context: ./services
      args:
        SERVICE: estoque
    container_name: ai-orchestrator-estoque
    ports:
      - "127.0.0.1:8103:8000"
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?defina INTERNAL_API_KEY no .env}
    volumes:
      - estoque_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=3)"]
      interval: 30s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  vendas:
    build:
      context: ./services
      args:
        SERVICE: vendas
    container_name: ai-orchestrator-vendas
    ports:
      - "127.0.0.1:8104:8000"
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?defina INTERNAL_API_KEY no .env}
    volumes:
      - vendas_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=3)"]
      interval: 30s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Langfuse: observabilidade LLM (traces, generations, scores)
  langfuse-db:
    image: postgres:16-alpine
    container_name: ai-orchestrator-langfuse-db
    environment:
      - POSTGRES_DB=langfuse
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=${LANGFUSE_DB_PASSWORD:-langfuse-local}
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 30s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    container_name: ai-orchestrator-langfuse
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-langfuse-local}@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-mysecret-change-in-production}
      - SALT=${LANGFUSE_SALT:-mysalt-change-in-production}
      - NEXTAUTH_URL=http://localhost:3100
      - TELEMETRY_ENABLED=false
      - HOSTNAME=0.0.0.0
    depends_on:
      langfuse-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/public/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Exposição pública via Cloudflare Tunnel (suasalada.com.br).
  # Só sobe com o profile "public": docker compose --profile public up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ai-orchestrator-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - gateway
    profiles:
      - public
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data:
  financas_data:
  rh_data:
  estoque_data:
  vendas_data:
  langfuse_db_data:
